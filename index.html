<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zauber-Quiz</title>
<meta name="description" content="Das Familien-Quiz mit Zauberer-Avatar, Vorlesefunktion und Familien-Duell.">
<meta name="theme-color" content="#1d1245">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zauber-Quiz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root {
  --sky1: #1d1245;
  --sky2: #3a1f7a;
  --card: #ffffff;
  --card-sunk: #f4f0fb;
  --ink: #241a3d;
  --muted: #6a6180;
  --line: #e2dcef;
  --magic: #6c3fc5;
  --magic-soft: #ece4fb;
  --gold: #f5c542;
  --gold-ink: #5a4000;
  --good: #1f9d5c;
  --good-soft: #dcf5e8;
  --bad: #d64545;
  --bad-soft: #fde3e3;
  --font: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --r: 22px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  color: #fff;
  background: radial-gradient(120% 80% at 50% 0%, var(--sky2) 0%, var(--sky1) 70%) fixed, var(--sky1);
  min-height: 100dvh;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff9 50%, transparent 51%),
    radial-gradient(1px 1px at 27% 62%, #fff8 50%, transparent 51%),
    radial-gradient(2px 2px at 44% 9%, #ffe9a6 50%, transparent 51%),
    radial-gradient(1px 1px at 63% 35%, #fff9 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 81% 14%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 91% 58%, #fff8 50%, transparent 51%),
    radial-gradient(2px 2px at 8% 84%, #ffe9a6 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 88%, #fff8 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 52% 74%, #fff7 50%, transparent 51%);
}
#app {
  position: relative; z-index: 1;
  max-width: 540px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);
}
button { font-family: inherit; cursor: pointer; border: 0; color: inherit; }
input { font-family: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; }

.topbar { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 10px; }
.topbar .title { flex: 1; font-size: 20px; font-weight: 600; }
.iconbtn {
  width: 48px; height: 48px; border-radius: 16px; flex: none;
  background: #ffffff1f; font-size: 22px; display: grid; place-items: center;
}
.iconbtn:active { transform: scale(.94); }
.starpill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--gold); color: var(--gold-ink); font-weight: 700;
  padding: 8px 14px; border-radius: 999px; font-size: 18px;
}

.hero { text-align: center; padding: 10px 0 18px; }
.hero h1 { font-size: clamp(28px, 8.6vw, 38px); white-space: nowrap; letter-spacing: .5px; text-shadow: 0 3px 0 #0004; }
.hero h1 .spark { display: inline-block; animation: twinkle 2.4s infinite ease-in-out; }
.hero p { margin: 6px 0 0; font-size: 19px; color: #e6dcff; }

.players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pcard {
  background: var(--card); color: var(--ink); border-radius: var(--r);
  padding: 10px 10px 14px; text-align: center; position: relative;
  box-shadow: 0 6px 0 #0003;
}
.pcard:active { transform: translateY(3px); box-shadow: 0 3px 0 #0003; }
.pcard .av { width: 100%; max-width: 140px; aspect-ratio: 200/240; margin: 0 auto; display: block; }
.pcard .name { font-size: 24px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
.pcard .meta { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.badge { font-size: 14px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--magic-soft); color: var(--magic); }
.badge.gold { background: #fff3c9; color: var(--gold-ink); }
.pcard.add { display: grid; place-items: center; min-height: 200px; background: #ffffff14; color: #fff; border: 3px dashed #ffffff55; box-shadow: none; }
.pcard.add .plus { font-size: 48px; line-height: 1; }
.pcard.add .name { font-size: 19px; font-weight: 600; }

.bigbtn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 64px; padding: 12px 18px; border-radius: 20px;
  font-size: 22px; font-weight: 700;
  background: var(--gold); color: var(--gold-ink); box-shadow: 0 6px 0 #b8871a;
}
.bigbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8871a; }
.bigbtn.purple { background: var(--magic); color: #fff; box-shadow: 0 6px 0 #45237f; }
.bigbtn.purple:active { box-shadow: 0 2px 0 #45237f; }
.bigbtn.ghost { background: #ffffff1f; color: #fff; box-shadow: none; }
.bigbtn.white { background: #fff; color: var(--ink); box-shadow: 0 6px 0 #0003; }
.bigbtn:disabled { opacity: .45; }
.stack { display: grid; gap: 14px; margin-top: 18px; }

.panel { background: var(--card); color: var(--ink); border-radius: var(--r); padding: 18px; box-shadow: 0 6px 0 #0003; }
.panel + .panel { margin-top: 14px; }
.center { text-align: center; }
.muted { color: var(--muted); }

.me { display: flex; flex-direction: column; align-items: center; text-align: center; }
.me .av { width: 190px; aspect-ratio: 200/240; }
.me .name { font-size: 34px; font-weight: 700; margin-top: 4px; }
.me .meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
.me .meta .badge { font-size: 16px; }

.section-title { font-size: 20px; font-weight: 600; margin: 22px 0 10px; color: #e6dcff; }
.topics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.topic {
  background: var(--card); color: var(--ink); border-radius: var(--r); padding: 16px 10px 14px;
  text-align: center; box-shadow: 0 6px 0 #0003;
}
.topic:active { transform: translateY(3px); box-shadow: 0 3px 0 #0003; }
.topic .emo { font-size: 46px; line-height: 1.1; }
.topic .lbl { font-size: 19px; font-weight: 700; margin-top: 6px; }
.topic.sel { outline: 4px solid var(--gold); }
.topic:last-child:nth-child(odd) { grid-column: 1 / -1; }

/* Quiz */
.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dots { flex: 1; display: flex; gap: 6px; justify-content: center; }
.dot { width: 16px; height: 16px; border-radius: 50%; background: #ffffff33; }
.dot.now { background: #fff; transform: scale(1.2); }
.dot.ok { background: #3ddc84; }
.dot.no { background: #ff6b6b; }
.turnchip {
  display: flex; align-items: center; gap: 8px; margin: 0 auto 12px; width: fit-content;
  background: #ffffff1f; padding: 4px 14px 4px 4px; border-radius: 999px; font-weight: 600; font-size: 18px;
}
.turnchip svg { width: 38px; height: 46px; background: #fff; border-radius: 999px; }
.qcard { background: var(--card); color: var(--ink); border-radius: 26px; padding: 18px 18px 20px; box-shadow: 0 6px 0 #0003; position: relative; }
.qemoji { font-size: 76px; line-height: 1.1; text-align: center; margin: 4px 0 8px; }
.qtext { font-size: 23px; font-weight: 600; line-height: 1.35; text-align: center; }
.lv-leicht .qtext { font-size: 26px; }
.speak {
  position: absolute; top: 12px; right: 12px; width: 54px; height: 54px; border-radius: 18px;
  background: var(--magic-soft); color: var(--magic); font-size: 26px; display: grid; place-items: center;
}
.speak.on { background: var(--magic); color: #fff; animation: pulse 1s infinite; }
.qnum { position: absolute; top: 18px; left: 18px; font-size: 15px; font-weight: 600; color: var(--muted); }
.answers { display: grid; gap: 12px; margin-top: 16px; }
.ans {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 66px;
  padding: 10px 16px 10px 10px; border-radius: 20px; text-align: left;
  background: var(--card); color: var(--ink); font-size: 21px; font-weight: 600; line-height: 1.25;
  box-shadow: 0 5px 0 #0003; transition: transform .1s;
}
.lv-leicht .ans { font-size: 23px; min-height: 72px; }
.ans:active { transform: translateY(3px); }
.ans .k {
  flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
  color: #fff; font-size: 22px; font-weight: 700;
}
.ans:nth-child(1) .k { background: #e8578a; }
.ans:nth-child(2) .k { background: #3b8ef0; }
.ans:nth-child(3) .k { background: #f59e0b; }
.ans:nth-child(4) .k { background: #22b07d; }
.ans.right { background: var(--good-soft); outline: 4px solid var(--good); }
.ans.right .k { background: var(--good); }
.ans.wrong { background: var(--bad-soft); outline: 4px solid var(--bad); }
.ans.wrong .k { background: var(--bad); }
.ans.dim { opacity: .45; }
.answers.locked .ans { pointer-events: none; }

.feedback { margin-top: 14px; border-radius: 22px; padding: 16px; color: var(--ink); animation: pop .3s ease-out; }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: #fff1dc; }
.feedback h3 { font-size: 26px; }
.feedback.good h3 { color: var(--good); }
.feedback.bad h3 { color: #b45309; }
.feedback p { margin: 8px 0 0; font-size: 19px; line-height: 1.4; }
.feedback .row { display: flex; gap: 10px; align-items: center; }
.feedback .row h3 { flex: 1; }
.feedback .mini-speak { width: 46px; height: 46px; border-radius: 14px; background: #fff; color: var(--magic); font-size: 22px; flex: none; }
.feedback .bigbtn { margin-top: 14px; }

/* Handoff */
.handoff { text-align: center; padding-top: 30px; }
.handoff .phone { font-size: 56px; animation: wiggle 1.2s infinite ease-in-out; }
.handoff h2 { font-size: 36px; margin-top: 8px; }
.handoff p { font-size: 20px; color: #e6dcff; margin: 8px 0 0; }
.handoff .av { width: 200px; aspect-ratio: 200/240; margin: 16px auto 0; display: block; background: #fff; border-radius: 32px; padding: 8px; }
.score-strip { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.score-strip span { background: #ffffff1f; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 17px; }

/* Result */
.result { text-align: center; }
.result .av { width: 210px; aspect-ratio: 200/240; margin: 0 auto; display: block; animation: hop 1.2s infinite ease-in-out; }
.result h2 { font-size: 34px; margin-top: 6px; }
.result .big { font-size: 22px; margin: 6px 0 0; color: #e6dcff; }
.bigstars { font-size: 46px; letter-spacing: 6px; margin-top: 8px; }
.bigstars .off { filter: grayscale(1) opacity(.35); }
.earned { display: inline-flex; margin-top: 14px; font-size: 22px; }
.hint { margin-top: 14px; background: #ffffff1f; border-radius: 18px; padding: 12px 14px; font-size: 18px; }

.podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin-top: 20px; }
.pod { flex: 1; max-width: 150px; text-align: center; }
.pod .av { width: 100%; aspect-ratio: 200/240; animation: none; }
.pod .blk { background: var(--card); color: var(--ink); border-radius: 16px 16px 6px 6px; padding: 8px 4px; font-weight: 700; }
.pod .blk .pl { font-size: 30px; }
.pod .blk .nm { font-size: 18px; overflow-wrap: anywhere; }
.pod .blk .sc { font-size: 16px; color: var(--muted); font-weight: 600; }
.pod.p1 .blk { min-height: 130px; background: #fff3c9; }
.pod.p2 .blk { min-height: 100px; }
.pod.p3 .blk { min-height: 80px; }
.pod.p4 .blk { min-height: 64px; }
.pod.p1 .av { animation: hop 1.2s infinite ease-in-out; }

/* Wardrobe */
.wtop { position: sticky; top: 0; z-index: 3; margin: calc(-14px - env(safe-area-inset-top)) -16px 0; padding: calc(env(safe-area-inset-top) + 14px) 16px 10px; background: linear-gradient(var(--sky1) 85%, #1d124500); }
.wprev { display: flex; align-items: center; gap: 14px; }
.wprev .av { width: 118px; aspect-ratio: 200/240; background: #fff; border-radius: 26px; padding: 4px; flex: none; }
.wprev .info { flex: 1; min-width: 0; }
.wprev .info .name { font-size: 26px; font-weight: 700; overflow-wrap: anywhere; }
.wprev .info .starpill { margin-top: 8px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 10px 16px; border-radius: 999px; background: #ffffff1f; font-size: 18px; font-weight: 600; min-height: 46px; }
.tab.sel { background: #fff; color: var(--ink); }
.items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.item { background: var(--card); color: var(--ink); border-radius: 18px; padding: 6px 6px 10px; text-align: center; box-shadow: 0 4px 0 #0003; position: relative; }
.item:active { transform: translateY(2px); }
.item svg { width: 100%; aspect-ratio: 200/240; display: block; }
.item .swatch { width: 100%; aspect-ratio: 1; display: grid; place-items: center; }
.item .swatch i { width: 64%; aspect-ratio: 1; border-radius: 50%; border: 3px solid #0002; }
.item .nm { font-size: 15px; font-weight: 600; line-height: 1.15; min-height: 2.3em; display: grid; place-items: center; }
.item .pr { margin-top: 4px; font-size: 15px; font-weight: 700; border-radius: 999px; padding: 3px 0; background: #fff3c9; color: var(--gold-ink); }
.item .pr.own { background: var(--magic-soft); color: var(--magic); }
.item .pr.on { background: var(--good); color: #fff; }
.item.worn { outline: 4px solid var(--good); }
.item.locked svg, .item.locked .swatch { opacity: .55; }
.item.cant { animation: shake .35s; }

/* Forms */
.field { margin-top: 16px; }
.field label { display: block; font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.field input[type=text] {
  width: 100%; font-size: 22px; padding: 14px 16px; border-radius: 16px;
  border: 3px solid var(--line); color: var(--ink); background: var(--card-sunk); -webkit-user-select: text; user-select: text;
}
.field input[type=text]:focus { outline: none; border-color: var(--magic); }
.choice { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
  padding: 14px; border-radius: 18px; background: var(--card-sunk); color: var(--ink); border: 3px solid transparent;
}
.opt.sel { border-color: var(--magic); background: var(--magic-soft); }
.opt .emo { font-size: 34px; }
.opt b { font-size: 20px; display: block; }
.opt small { font-size: 16px; color: var(--muted); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; background: var(--card-sunk); border-radius: 18px; font-size: 19px; font-weight: 600; width: 100%; color: var(--ink); text-align: left; }
.sw { width: 60px; height: 34px; border-radius: 999px; background: #c9c1da; position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px #0003; }
.sw.on { background: var(--good); }
.sw.on::after { transform: translateX(26px); }
.danger { background: var(--bad-soft); color: var(--bad); font-size: 18px; font-weight: 600; padding: 14px; border-radius: 16px; width: 100%; margin-top: 22px; }

.pickrow { display: grid; gap: 10px; }
.pick { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: 20px; background: var(--card); color: var(--ink); text-align: left; width: 100%; border: 4px solid transparent; }
.pick svg { width: 58px; height: 70px; flex: none; }
.pick .nm { flex: 1; font-size: 22px; font-weight: 700; }
.pick .ck { width: 38px; height: 38px; border-radius: 12px; border: 3px solid var(--line); display: grid; place-items: center; font-size: 22px; color: #fff; }
.pick.sel { border-color: var(--gold); }
.pick.sel .ck { background: var(--good); border-color: var(--good); }

/* Modal / toast */
.modal-bg { position: fixed; inset: 0; background: #0009; z-index: 20; display: grid; place-items: center; padding: 16px; animation: fade .2s; }
.modal { background: var(--card); color: var(--ink); border-radius: 26px; padding: 22px; width: 100%; max-width: 420px; text-align: center; animation: pop .25s ease-out; }
.modal h3 { font-size: 26px; }
.modal p { font-size: 19px; margin: 10px 0 0; color: var(--muted); }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.modal .bigbtn { font-size: 19px; min-height: 56px; }
.modal .bigbtn.ghost { background: var(--card-sunk); color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%); background: #fff; color: var(--ink); padding: 12px 20px; border-radius: 999px; font-size: 18px; font-weight: 600; z-index: 30; box-shadow: 0 6px 20px #0005; animation: pop .25s ease-out; max-width: calc(100% - 32px); text-align: center; }

.footer { display: flex; justify-content: center; gap: 10px; margin-top: 26px; }
.footer .iconbtn { width: auto; padding: 0 16px; font-size: 17px; font-weight: 600; gap: 8px; display: flex; align-items: center; }

.spark-layer { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.spark-layer i { position: absolute; font-style: normal; font-size: 26px; animation: fly 1.1s ease-out forwards; }

@keyframes twinkle { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.25) rotate(15deg); } }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 #6c3fc580; } 50% { box-shadow: 0 0 0 8px #6c3fc500; } }
@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes wiggle { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes fly { from { transform: translate(0,0) scale(.6); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(40deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 360px) {
  .qtext { font-size: 21px; } .lv-leicht .qtext { font-size: 23px; }
  .ans { font-size: 19px; } .lv-leicht .ans { font-size: 21px; }
  .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:20px;font-size:20px">Bitte JavaScript einschalten, damit das Zauber-Quiz funktioniert.</p></noscript>

<script>
"use strict";

/* ================================================================
   FRAGEN
   Format: [Thema, Stufe, Emoji, Frage, [richtige Antwort, falsche …], Zusatzwissen]
   Stufe "l" = leicht (Zauberlehrling), "s" = schwer (Meistermagier)
   Neue Fragen einfach unten ergänzen – die erste Antwort ist immer die richtige.
   ================================================================ */
const Q = [
  // ---------- Allgemeinwissen · leicht ----------
  ["welt","l","🇮🇹","Zu welchem Land gehört diese Flagge?",["Italien","Frankreich","Irland"],"Aus Italien kommen Pizza und Spaghetti."],
  ["welt","l","🇫🇷","Zu welchem Land gehört diese Flagge?",["Frankreich","Italien","Niederlande"],"In Frankreichs Hauptstadt Paris steht der Eiffelturm."],
  ["welt","l","🇪🇸","Zu welchem Land gehört diese Flagge?",["Spanien","Portugal","Belgien"],"In Spanien sagt man „Hola“ zur Begrüßung."],
  ["welt","l","🇯🇵","Zu welchem Land gehört diese Flagge?",["Japan","China","Kanada"],"Japan nennt man auch „Land der aufgehenden Sonne“."],
  ["welt","l","🇬🇷","Zu welchem Land gehört diese Flagge?",["Griechenland","Finnland","Schweden"],"In Griechenland gab es die allerersten Olympischen Spiele."],
  ["welt","l","🇩🇪","Wie heißt die Hauptstadt von Deutschland?",["Berlin","München","Hamburg"],"Berlin ist auch die größte Stadt Deutschlands."],
  ["welt","l","🗼","In welcher Stadt steht der Eiffelturm?",["Paris","London","Rom"],"Der Eiffelturm ist über 300 Meter hoch."],
  ["welt","l","🦒","Welches Tier hat den längsten Hals?",["Giraffe","Elefant","Kamel"],"Die Giraffe hat genau so viele Halswirbel wie du: sieben!"],
  ["welt","l","🐋","Welches ist das größte Tier der Welt?",["Blauwal","Elefant","Weißer Hai"],"Ein Blauwal kann so lang werden wie zwei Busse."],

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt)));
  return "#" + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, "0")).join("");
}
function starPts(cx, cy, r1, r2, n = 5, rot = -90) {
  const p = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = (rot + i * 180 / n) * Math.PI / 180;
    p.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1));
  }
  return p.join(" ");
}

function defaultState() {

  };
}

try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ================================================================
   HELFER: Ton, Vorlesen, Glitzer
   ================================================================ */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = sel => document.querySelector(sel);
const app = $("#app");
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let actx;
function tone(notes) {
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    let t = actx.currentTime;
    for (const [f, d, type] of notes) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .05);
      t += d * .7;
    }
  } catch (e) {}
}
const sfx = {
  tap: () => tone([[660, .08, "triangle"]]),
  good: () => tone([[784, .14], [988, .14], [1319, .3]]),
  bad: () => tone([[330, .18, "triangle"], [262, .3, "triangle"]]),
  win: () => tone([[523, .12], [659, .12], [784, .12], [1047, .4]]),
  buy: () => tone([[880, .1], [1175, .1], [1568, .3]]),
};
function buzz(ms) { try { if (S.sound && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let deVoice = null;
function pickVoice() {
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  deVoice = vs.find(v => /^de[-_]DE/i.test(v.lang) && /google|anna|petra|helena|katja/i.test(v.name)) || vs.find(v => /^de/i.test(v.lang)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const stripEmoji = t => t.replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}‍️]/gu, "").replace(/\s+/g, " ").trim();
function speak(text, slow, onEnd) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(stripEmoji(text));
    u.lang = "de-DE"; if (deVoice) u.voice = deVoice;
    u.rate = slow ? .88 : 1; u.pitch = 1.05;
    u.onend = u.onerror = () => onEnd && onEnd();
    speechSynthesis.speak(u);
  } catch (e) { onEnd && onEnd(); }
}
function stopSpeak() { if (canSpeak) try { speechSynthesis.cancel(); } catch (e) {} }

function sparkle(x, y, n = 14, set = ["✨", "⭐", "🌟", "💫"]) {
  let layer = $(".spark-layer");
  if (!layer) { layer = document.createElement("div"); layer.className = "spark-layer"; document.body.appendChild(layer); }
  for (let i = 0; i < n; i++) {
    const el = document.createElement("i");
    el.textContent = set[i % set.length];
    const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 110;
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    el.style.setProperty("--dy", Math.sin(ang) * dist - 40 + "px");
    layer.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
}

function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}
function confirmBox(title, text, yes, no, onYes) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${title}</h3>${text ? `<p>${text}</p>` : ""}
    <div class="row"><button class="bigbtn ghost" data-no>${no}</button><button class="bigbtn" data-yes>${yes}</button></div></div>`;
  bg.addEventListener("click", e => {
    if (e.target === bg || e.target.closest("[data-no]")) bg.remove();
    else if (e.target.closest("[data-yes]")) { bg.remove(); onYes(); }
  });
  document.body.appendChild(bg);
}

function render(html, after) {
  stopSpeak();
  app.innerHTML = html;
  window.scrollTo(0, 0);
  after && after();
}
// Ein Klick-Handler für alles mit data-go
app.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (!b) return;
  const [fn, ...args] = b.dataset.go.split("|");
  if (ACTIONS[fn]) { if (fn !== "answer") sfx.tap(); ACTIONS[fn](...args); }
});

/* ---------- Quiz ---------- */
function pickQuestions(p, topic, n, exclude) {
  const pool = QUESTIONS.filter(q => q.l === p.level && (topic === "mix" || q.t === topic) && !exclude.has(q.id));
  const ranked = shuffle(pool).sort((a, b) => (p.seen[a.id] || 0) - (p.seen[b.id] || 0));
  const out = ranked.slice(0, n);
  out.forEach(q => exclude.add(q.id));
  return out;
}
function startSession(ids, topic, mode) {
  lastTopic = topic;
  const used = new Set();
  const per = {};
  ids.forEach(id => { per[id] = pickQuestions(P(id), topic, ROUND, used); });
  const queue = [];
  for (let r = 0; r < ROUND; r++) ids.forEach(id => { if (per[id][r]) queue.push({ pid: id, q: per[id][r] }); });
  session = { mode, topic, ids, queue, i: 0, res: {}, answered: false };
  ids.forEach(id => session.res[id] = []);
  nextStep();
}
function nextStep() {
  const s = session;
  if (s.i >= s.queue.length) return result();
  const cur = s.queue[s.i];
  if (s.mode === "family" && (s.i === 0 || s.queue[s.i - 1].pid !== cur.pid)) return handoff(cur.pid);
  question();
}
function handoff(pid) {
  const p = P(pid);
  const strip = session.ids.map(id => `<span>${esc(P(id).name)}: ${session.res[id].filter(Boolean).length} ✓</span>`).join("");
  render(`
    <div class="topbar"><button class="iconbtn" data-go="quit" aria-label="Beenden">✖️</button></div>
    <div class="handoff">
      <div class="phone">📱</div>
      <h2>${esc(p.name)} ist dran!</h2>
      <p>Gib das Handy an ${esc(p.name)} weiter.</p>
      ${avatarSVG(p.avatar)}
      <div class="stack"><button class="bigbtn" data-go="question">Ich bin bereit! ✨</button></div>
      <div class="score-strip">${strip}</div>
    </div>`, () => { if (p.autoRead) speak(`${p.name} ist dran!`, p.level === "l"); });
}
function question() {
  const s = session, cur = s.queue[s.i], p = P(cur.pid), q = cur.q;
  s.answered = false;
  s.order = shuffle(q.a.map((t, k) => ({ t, ok: k === 0 })));
  const mine = s.queue.filter(x => x.pid === cur.pid);
  const nr = mine.indexOf(cur);
  const dots = mine.map((x, k) => {
    const r = s.res[cur.pid][k];
    return `<span class="dot ${k === nr ? "now" : r === true ? "ok" : r === false ? "no" : ""}"></span>`;
  }).join("");
  const keys = ["A", "B", "C", "D"];
  render(`
    <div class="lv-${p.level === "l" ? "leicht" : "schwer"}">
      <div class="qhead"><button class="iconbtn" data-go="quit" aria-label="Beenden">✖️</button><div class="dots">${dots}</div><span style="width:48px"></span></div>
      ${s.mode === "family" ? `<div class="turnchip">${avatarSVG(p.avatar, "")}${esc(p.name)}</div>` : ""}
      <div class="qcard">
        <div class="qnum">${TOPICS[q.t].emo} ${nr + 1} / ${mine.length}</div>
        ${canSpeak ? `<button class="speak" data-go="readQ" aria-label="Vorlesen">🔊</button>` : ""}
        <div class="qemoji">${q.e}</div>
        <div class="qtext">${esc(q.q)}</div>
      </div>
      <div class="answers">${s.order.map((o, k) => `<button class="ans" data-go="answer|${k}"><span class="k">${keys[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
      <div id="fb"></div>
    </div>`, () => { if (p.autoRead) setTimeout(readQ, 250); });
}
function readQ() {
  const s = session, cur = s.queue[s.i], p = P(cur.pid);
  const btn = $(".speak");
  const keys = ["A", "B", "C", "D"];
  const txt = cur.q.q + " ... " + s.order.map((o, k) => keys[k] + ": " + o.t).join(". ... ");
  btn && btn.classList.add("on");
  speak(txt, p.level === "l", () => { const b = $(".speak"); b && b.classList.remove("on"); });
}
const PRAISE = ["Richtig!", "Zauberhaft!", "Super gemacht!", "Volltreffer!", "Genau!", "Klasse!"];
const COMFORT = ["Knapp daneben!", "Nicht schlimm!", "Fast!", "Beim nächsten Mal!"];
function answer(k) {
  const s = session; if (s.answered) return;
  s.answered = true;
  stopSpeak();
  const cur = s.queue[s.i], p = P(cur.pid), q = cur.q;
  const ok = s.order[k].ok;
  const btns = [...document.querySelectorAll(".ans")];
  $(".answers").classList.add("locked");
  btns.forEach((b, j) => {
    if (s.order[j].ok) b.classList.add("right");
    else if (j === +k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  s.res[cur.pid].push(ok);
  p.seen[q.id] = (p.seen[q.id] || 0) + 1;
  p.played++; if (ok) { p.correct++; p.stars += 1; }
  save();
  const right = s.order.find(o => o.ok).t;
  const head = ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : COMFORT[Math.floor(Math.random() * COMFORT.length)];
  const last = s.i === s.queue.length - 1;
  const nextLbl = last ? "Zum Ergebnis 🏆" : s.mode === "family" && s.queue[s.i + 1].pid !== cur.pid ? "Weitergeben ➜" : "Weiter ➜";
  $("#fb").innerHTML = `<div class="feedback ${ok ? "good" : "bad"}">
    <div class="row"><h3>${ok ? "✨ " + head + " +1 ⭐" : "🙈 " + head}</h3>${canSpeak ? `<button class="mini-speak" data-go="readFb" aria-label="Vorlesen">🔊</button>` : ""}</div>
    ${ok ? "" : `<p>Richtig ist: <b>${esc(right)}</b></p>`}
    ${q.f ? `<p>💡 ${esc(q.f)}</p>` : ""}
    <button class="bigbtn purple" data-go="next">${nextLbl}</button></div>`;
  s.fbText = (ok ? head : head + " Richtig ist: " + right + ".") + " " + (q.f || "");
  if (ok) { sfx.good(); buzz(30); const r = btns[k].getBoundingClientRect(); sparkle(r.left + r.width / 2, r.top + r.height / 2); }
  else { sfx.bad(); buzz([40, 60, 40]); }
  setTimeout(() => $("#fb") && $("#fb").scrollIntoView({ behavior: "smooth", block: "nearest" }), 60);
  if (p.autoRead) setTimeout(() => speak(s.fbText, p.level === "l"), 500);
}
function result() {
  const s = session;
  const bonus = {};
  s.ids.forEach(id => {
    const r = s.res[id], c = r.filter(Boolean).length;
    bonus[id] = r.length && c === r.length ? 3 : 0;
    if (bonus[id]) P(id).stars += bonus[id];
  });
  save();
  sfx.win();
  setTimeout(() => sparkle(innerWidth / 2, innerHeight / 3, 22), 150);
  if (s.mode === "solo") {
    const p = P(s.ids[0]), r = s.res[p.id], c = r.filter(Boolean).length;
    const earned = c + bonus[p.id];
    const nStars = c === r.length ? 3 : c >= Math.ceil(r.length * .6) ? 2 : c >= 1 ? 1 : 0;
    const msg = c === r.length ? "Alles richtig – du bist ein echtes Zaubergenie!" : c >= 3 ? "Richtig stark gezaubert!" : c >= 1 ? "Gut gemacht – übung macht den Meister!" : "Das war knifflig! Probier's gleich nochmal.";
    const afford = cheapestAffordable(p);
    render(`
      <div class="result">
        ${avatarSVG(p.avatar)}
        <h2>${c} von ${r.length} richtig!</h2>
        <div class="bigstars">${[0, 1, 2].map(k => `<span class="${k < nStars ? "" : "off"}">⭐</span>`).join("")}</div>
        <p class="big">${msg.replace("übung", "Übung")}</p>
        <span class="starpill earned">+${earned} ⭐${bonus[p.id] ? " (inkl. 3 Bonus!)" : ""}</span>
        ${afford ? `<div class="hint">🎁 Du hast genug Sterne für: <b>${esc(afford.name)}</b>! Schau in die Garderobe.</div>` : ""}
        <div class="stack">
          <button class="bigbtn" data-go="startSolo|${p.id}|${s.topic}">🔁 Nochmal spielen</button>
          <button class="bigbtn white" data-go="wardrobe|${p.id}|robe">🎩 Garderobe</button>
          <button class="bigbtn ghost" data-go="me|${p.id}">Anderes Thema</button>
        </div>
      </div>`, () => { if (p.autoRead) speak(`${c} von ${r.length} richtig! ${msg}`, p.level === "l"); });
  } else {
    const rows = s.ids.map(id => ({ p: P(id), c: s.res[id].filter(Boolean).length, n: s.res[id].length }))
      .sort((a, b) => b.c - a.c);
    let place = 0, prev = -1;
    rows.forEach((r, k) => { if (r.c !== prev) { place = k + 1; prev = r.c; } r.place = place; });
    const medal = { 1: "🥇", 2: "🥈", 3: "🥉", 4: "🎖️" };
    // Podest-Reihenfolge: 2, 1, 3, 4
    const order = rows.length >= 3 ? [rows[1], rows[0], ...rows.slice(2)] : rows;
    const winners = rows.filter(r => r.place === 1).map(r => r.p.name);
    const title = winners.length > 1 ? "Unentschieden! 🤝" : `${esc(winners[0])} gewinnt! 🏆`;
    render(`
      <div class="result">
        <h2>${title}</h2>
        <div class="podium">${order.map(r => `
          <div class="pod p${r.place}">${avatarSVG(r.p.avatar)}
            <div class="blk"><div class="pl">${medal[r.place]}</div><div class="nm">${esc(r.p.name)}</div><div class="sc">${r.c} / ${r.n} ✓</div></div></div>`).join("")}
        </div>
        <div class="hint">Jeder hat ⭐ für seine richtigen Antworten bekommen – ab in die Garderobe!</div>
        <div class="stack">
          <button class="bigbtn" data-go="startFamily">🔁 Revanche!</button>
          <button class="bigbtn ghost" data-go="home">Zum Start</button>
        </div>
      </div>`, () => speak(winners.length > 1 ? "Unentschieden!" : `${winners[0]} gewinnt!`, true));
  }
}
function cheapestAffordable(p) {
  let best = null;
  for (const [cat, c] of Object.entries(SHOP)) for (const it of c.items)
    if (it.price > 0 && !owns(p, cat, it.id) && it.price <= p.stars && (!best || it.price > best.price)) best = it;
  return best;
}

/* ================================================================
   AKTIONEN
   ================================================================ */
const ACTIONS = {
  home, me, edit, wardrobe, familySetup, question, readQ, answer,
  next() { session.i++; nextStep(); },
  readFb() { const p = P(session.queue[session.i].pid); speak(session.fbText, p.level === "l"); },
  quit() {
    confirmBox("Quiz beenden?", "Die Sterne, die du schon gesammelt hast, behältst du.", "Beenden", "Weiterspielen", () => {
      const s = session; session = null;
      s && s.mode === "solo" ? me(s.ids[0]) : home();
    });
  },
  startSolo(id, topic) { startSession([id], topic, "solo"); },
  startFamily() { if (familyPick.length >= 2) startSession(familyPick.slice(), lastTopic, "family"); },
  famToggle(id) {
    if (familyPick.includes(id)) familyPick = familyPick.filter(x => x !== id);
    else if (familyPick.length < 4) familyPick.push(id);
    else toast("Höchstens 4 Spieler");
    familySetup();
  },
  famTopic(k) { lastTopic = k; familySetup(); },
  toggleSound() { S.sound = !S.sound; save(); home(); },
  draftLevel(k) { draft.level = k; edit(draft.for); },
  draftRead() { draft.autoRead = !draft.autoRead; edit(draft.for); },
  saveEdit() {
    const name = (draft.name || "").trim();
    if (!name) { toast("Bitte gib einen Namen ein ✏️"); $("#nm").focus(); return; }
    let id = draft.for;
    if (id === "new") { const p = newPlayer(name, draft.level); p.autoRead = draft.autoRead; S.players.push(p); id = p.id; }
    else { const p = P(id); p.name = name; p.level = draft.level; p.autoRead = draft.autoRead; }
    draft = null; save(); me(id);
  },
  delPlayer(id) {
    const p = P(id);
    confirmBox(`${esc(p.name)} wirklich löschen?`, "Alle Sterne und Sachen aus der Garderobe gehen verloren.", "Löschen", "Abbrechen", () => {
      S.players = S.players.filter(x => x.id !== id); familyPick = familyPick.filter(x => x !== id); draft = null; save(); home();
    });
  },
  look(id, key, val) { const p = P(id); p.avatar[key] = val; save(); ACTIONS._keepScroll = true; wardrobe(id, "look"); },
  pick(id, cat, itemId) {
    const p = P(id), it = item(cat, itemId);
    if (owns(p, cat, itemId)) { p.avatar[cat] = itemId; save(); ACTIONS._keepScroll = true; return wardrobe(id, cat); }
    if (p.stars < it.price) {
      const el = document.getElementById(`it-${cat}-${itemId}`);
      if (el) { el.classList.remove("cant"); void el.offsetWidth; el.classList.add("cant"); }
      sfx.bad();
      return toast(`Dir fehlen noch ${it.price - p.stars} ⭐ – spiel ein Quiz!`);
    }
    confirmBox(`${esc(it.name.replace("|", ""))} holen?`, `Das kostet ${it.price} ⭐. Du hast ${p.stars} ⭐.`, "Ja, holen!", "Nein", () => {
      p.stars -= it.price; p.owned.push(cat + ":" + itemId); p.avatar[cat] = itemId; save();
      sfx.buy(); sparkle(innerWidth / 2, 120, 18);
      ACTIONS._keepScroll = true; wardrobe(id, cat);
      toast(`✨ ${it.name.replace("|", "")} gehört jetzt dir!`);
    });
  },
};

home();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
