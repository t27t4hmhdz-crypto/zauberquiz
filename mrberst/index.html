<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr. Quiz Show</title>
<meta name="description" content="Die Familien-Spielshow: Schätzfragen, Was ist mehr? und Wahr oder Quatsch – mit eurem Familienfoto.">
<meta name="theme-color" content="#14185e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mr. Quiz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
:root {
  --bg1: #14185e;
  --bg2: #2a2fb8;
  --pink: #ff2e88;
  --pink-d: #b5165c;
  --yellow: #ffd400;
  --yellow-d: #c79f00;
  --cyan: #19d3ff;
  --green: #22d66b;
  --green-d: #13914a;
  --red: #ff3b3b;
  --red-d: #b31d1d;
  --ink: #16163a;
  --card: #ffffff;
  --muted: #6a6a8a;
  --show: "Lilita One", "Arial Black", Impact, system-ui, sans-serif;
  --font: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font); font-weight: 800; color: #fff;
  background: var(--bg1);
  min-height: 100dvh; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
body::before {
  content: ""; position: fixed; inset: -50%; z-index: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 50% 50%, #ffffff0d 0deg 10deg, transparent 10deg 20deg),
              radial-gradient(circle at 50% 40%, var(--bg2) 0%, var(--bg1) 55%);
  animation: spin 80s linear infinite;
}
#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
button { font-family: inherit; font-weight: 900; cursor: pointer; border: 0; color: inherit; }
input { font-family: inherit; }

/* Logo */
.logo { text-align: center; margin: 6px 0 14px; transform: rotate(-3deg); }
.logo .mr { font-family: var(--show); font-size: 30px; color: var(--yellow); letter-spacing: 2px;
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); }
.logo .nm { font-family: var(--show); font-size: clamp(44px, 15vw, 72px); line-height: .95; color: #fff;
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--pink), 9px 9px 0 var(--ink);
  overflow-wrap: anywhere; }
.logo .sub { display: inline-block; margin-top: 10px; background: var(--pink); padding: 4px 14px; border-radius: 8px;
  font-size: 15px; letter-spacing: 2px; text-transform: uppercase; transform: rotate(2deg); box-shadow: 3px 3px 0 var(--ink); }
.logo.small { margin: 0; transform: rotate(-2deg); }
.logo.small .mr { font-size: 16px; -webkit-text-stroke: 1px var(--ink); text-shadow: 2px 2px 0 var(--ink); }
.logo.small .nm { font-size: 30px; -webkit-text-stroke: 2px var(--ink); text-shadow: 3px 3px 0 var(--pink), 5px 5px 0 var(--ink); }

/* Panels */
.panel { background: var(--card); color: var(--ink); border-radius: 22px; padding: 16px; box-shadow: 0 6px 0 #0005; margin-top: 14px; }
.panel h2 { font-family: var(--show); font-weight: 400; font-size: 24px; margin: 0 0 10px; letter-spacing: .5px; }
.panel p.hint { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 700; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 60px;
  border-radius: 18px; font-size: 21px; padding: 10px 16px; background: var(--yellow); color: var(--ink);
  box-shadow: 0 6px 0 var(--yellow-d); text-transform: uppercase; letter-spacing: .5px; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--yellow-d); }
.btn.pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--pink-d); }
.btn.pink:active { box-shadow: 0 2px 0 var(--pink-d); }
.btn.green { background: var(--green); color: var(--ink); box-shadow: 0 6px 0 var(--green-d); }
.btn.green:active { box-shadow: 0 2px 0 var(--green-d); }
.btn.ghost { background: #ffffff22; color: #fff; box-shadow: none; text-transform: none; font-size: 18px; min-height: 52px; }
.btn.light { background: #eef0ff; color: var(--ink); box-shadow: none; text-transform: none; font-size: 18px; min-height: 52px; }
.btn:disabled { opacity: .45; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.mt { margin-top: 14px; }

.photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #e7e9ff; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph button { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 50%; background: #000a; color: #fff; font-size: 15px; line-height: 1; }
.ph.add { display: grid; place-items: center; border: 3px dashed #b9bde8; background: #f5f6ff; font-size: 30px; color: var(--muted); cursor: pointer; }

.namefield { display: flex; align-items: center; gap: 8px; background: #eef0ff; border-radius: 14px; padding: 4px 4px 4px 14px; }
.namefield span { font-family: var(--show); font-size: 24px; color: var(--pink); }
.namefield input, .addrow input {
  flex: 1; min-width: 0; border: 0; background: #fff; border-radius: 10px; padding: 12px; font-size: 20px; font-weight: 800; color: var(--ink);
  -webkit-user-select: text; user-select: text;
}
.namefield input:focus, .addrow input:focus { outline: 3px solid var(--cyan); }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #eef0ff; padding: 5px; border-radius: 16px; }
.seg button { min-height: 50px; border-radius: 12px; font-size: 18px; background: transparent; color: var(--ink); }
.seg button.on { background: var(--ink); color: #fff; }

.plist { display: grid; gap: 8px; margin-top: 12px; }
.pitem { display: flex; align-items: center; gap: 10px; background: #f5f6ff; border-radius: 14px; padding: 8px 8px 8px 12px; font-size: 20px; }
.pitem .dotc { width: 28px; height: 28px; border-radius: 50%; flex: none; border: 3px solid var(--ink); }
.pitem .nm { flex: 1; overflow-wrap: anywhere; }
.pitem button { width: 40px; height: 40px; border-radius: 12px; background: #ffe1ea; color: var(--pink-d); font-size: 18px; }
.addrow { display: flex; gap: 8px; margin-top: 10px; }
.addrow input { background: #eef0ff; }
.addrow button { width: 56px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 26px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; border-radius: 999px; font-size: 16px; background: #eef0ff; color: var(--muted); border: 3px solid transparent; }
.chip.on { background: #fff6c4; color: var(--ink); border-color: var(--ink); }

/* Stage */
.score { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.score::-webkit-scrollbar { display: none; }
.sc { flex: none; display: flex; align-items: center; gap: 6px; background: #ffffff1f; border-radius: 999px; padding: 6px 12px 6px 6px; font-size: 16px; }
.sc i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; }
.sc b { font-family: var(--show); font-weight: 400; font-size: 20px; color: var(--yellow); }
.sc.lead { background: #ffd40033; }
.stagehead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.iconbtn { width: 46px; height: 46px; border-radius: 14px; background: #ffffff22; font-size: 20px; flex: none; display: grid; place-items: center; }

.frame-wrap { position: relative; margin: 10px auto 0; width: 100%; max-width: 420px; }
.frame { position: relative; width: 100%; aspect-ratio: 4/5; max-height: 54vh; margin: 0 auto; border-radius: 22px;
  border: 6px solid #fff; box-shadow: 0 0 0 6px var(--pink), 0 10px 30px #0008; background: radial-gradient(circle, #3a3fd0, var(--bg1)); }
.frame .tiles { position: absolute; inset: 0; border-radius: 16px; }
.tile { position: absolute; background-repeat: no-repeat; will-change: transform, opacity;
  transition: transform .9s cubic-bezier(.2,.7,.3,1), opacity .9s ease-in; }
.frame.shake { animation: shake .45s; }
.frame .flash { position: absolute; inset: -6px; border-radius: 22px; background: #fff; opacity: 0; pointer-events: none; }
.frame .flash.go { animation: flash .5s ease-out; }
.bulbs { position: absolute; inset: -18px; pointer-events: none; }
.bulbs i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 10px var(--yellow); animation: bulb 1s infinite; }

.bigred { display: block; margin: 26px auto 0; width: 170px; height: 170px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff8a8a, var(--red) 45%, var(--red-d));
  box-shadow: 0 12px 0 #7a0f0f, 0 18px 30px #0008; color: #fff; font-family: var(--show); font-weight: 400; font-size: 34px;
  -webkit-text-stroke: 1.5px #7a0f0f; paint-order: stroke fill; line-height: 1; text-transform: uppercase; }
.bigred:active { transform: translateY(9px); box-shadow: 0 3px 0 #7a0f0f, 0 8px 20px #0008; }
.bigred small { display: block; font-size: 30px; margin-bottom: 4px; -webkit-text-stroke: 0; }
.bigred:not(:disabled) { animation: throb 1.6s infinite ease-in-out; }

/* Question */
.qtype { display: inline-block; font-family: var(--show); font-weight: 400; font-size: 20px; padding: 6px 16px; border-radius: 10px;
  transform: rotate(-2deg); box-shadow: 3px 3px 0 var(--ink); letter-spacing: .5px; }
.qtype.s { background: var(--cyan); color: var(--ink); }
.qtype.m { background: var(--yellow); color: var(--ink); }
.qtype.w { background: var(--pink); color: #fff; }
.qcard { position: relative; background: #fff; color: var(--ink); border-radius: 24px; padding: 18px; margin-top: 12px; box-shadow: 0 6px 0 #0005; text-align: center; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
.qcard .emo { font-size: 70px; line-height: 1.1; }
.qcard .q { font-size: 24px; line-height: 1.3; margin-top: 6px; }
.qcard .unit { margin-top: 8px; color: var(--muted); font-size: 17px; }
.speak { position: absolute; top: 10px; right: 10px; width: 48px; height: 48px; border-radius: 14px; background: #eef0ff; color: var(--ink); font-size: 22px; }

.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-top: 14px; }
.vs .opt { background: #fff; color: var(--ink); border-radius: 20px; padding: 14px 8px; text-align: center; box-shadow: 0 6px 0 #0005; border: 5px solid transparent; display: flex; flex-direction: column; justify-content: center; }
.vs .opt .e { font-size: 52px; line-height: 1.1; }
.vs .opt .t { font-size: 19px; margin-top: 6px; line-height: 1.2; }
.vs .opt .v { margin-top: 8px; font-family: var(--show); font-weight: 400; font-size: 22px; color: var(--pink); min-height: 1.2em; }
.vs .opt.win { border-color: var(--green); background: #e3fbec; animation: pop .4s; }
.vs .opt.lose { opacity: .5; }
.vs .mid { display: grid; place-items: center; font-family: var(--show); font-size: 28px; color: var(--yellow); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.tf div { border-radius: 20px; padding: 14px 6px; text-align: center; font-family: var(--show); font-weight: 400; font-size: 26px; border: 5px solid transparent; }
.tf .t { background: #d9fbe7; color: var(--green-d); }
.tf .f { background: #ffe1ea; color: var(--pink-d); }
.tf div.win { border-color: var(--ink); animation: pop .4s; }
.tf div.lose { opacity: .4; }
.tf div small { display: block; font-family: var(--font); font-size: 15px; font-weight: 800; margin-top: 2px; }

.countdown { text-align: center; font-family: var(--show); font-weight: 400; font-size: 130px; line-height: 1; margin: 20px 0; color: var(--yellow);
  -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--pink); animation: pop .4s; }
.countdown.go { font-size: 56px; }

.fact { background: #fff6c4; color: var(--ink); border-radius: 18px; padding: 14px; margin-top: 14px; font-size: 18px; line-height: 1.4; animation: pop .35s; }
.fact b { font-family: var(--show); font-weight: 400; font-size: 20px; }

.answer { text-align: center; margin-top: 14px; animation: pop .4s; }
.answer .lbl { font-size: 18px; color: #dfe1ff; }
.answer .num { font-family: var(--show); font-weight: 400; font-size: clamp(48px, 16vw, 76px); line-height: 1.05; color: var(--yellow);
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--pink); overflow-wrap: anywhere; }
.answer .u { font-size: 20px; font-family: var(--font); font-weight: 900; color: #fff; -webkit-text-stroke: 0; text-shadow: none; }
.ranking { display: grid; gap: 8px; margin-top: 14px; }
.rk { display: flex; align-items: center; gap: 10px; background: #fff; color: var(--ink); border-radius: 16px; padding: 10px 12px; font-size: 18px; animation: pop .35s both; }
.rk .pos { font-size: 26px; width: 34px; text-align: center; }
.rk .nm { flex: 1; overflow-wrap: anywhere; }
.rk .g { font-family: var(--show); font-weight: 400; font-size: 20px; text-align: right; }
.rk .d { font-size: 13px; color: var(--muted); display: block; font-family: var(--font); }
.rk.win { background: #e3fbec; outline: 4px solid var(--green); }
.rk .pts { background: var(--green); color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 16px; margin-left: 6px; }

.who { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.who button { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 16px; background: #fff; color: var(--ink); font-size: 18px; text-align: left; border: 4px solid transparent; min-height: 58px; }
.who button i { width: 22px; height: 22px; border-radius: 50%; flex: none; border: 2px solid var(--ink); }
.who button span { flex: 1; overflow-wrap: anywhere; }
.who button.on { border-color: var(--green); background: #e3fbec; }
.who button.on::after { content: "✓"; color: var(--green-d); font-size: 22px; }
.sectitle { font-family: var(--show); font-weight: 400; font-size: 24px; margin-top: 18px; text-align: center; }

/* Handoff & keypad */
.hand { text-align: center; padding-top: 30px; }
.hand .ph-ico { font-size: 64px; animation: wiggle 1.2s infinite; }
.hand h2 { font-family: var(--show); font-weight: 400; font-size: 40px; margin: 8px 0 0; overflow-wrap: anywhere; }
.hand p { font-size: 19px; color: #dfe1ff; margin: 8px 0 22px; }
.hand .tag { display: inline-block; width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff; vertical-align: middle; margin-right: 8px; }
.entry { background: #fff; color: var(--ink); border-radius: 22px; padding: 14px; margin-top: 12px; box-shadow: 0 6px 0 #0005; }
.entry .who-now { font-size: 17px; color: var(--muted); text-align: center; }
.entry .qsmall { font-size: 18px; text-align: center; margin: 4px 0 10px; line-height: 1.3; }
.display { background: var(--ink); color: var(--yellow); border-radius: 16px; padding: 10px 14px; text-align: right; font-family: var(--show); font-weight: 400; font-size: 42px; min-height: 70px; overflow-wrap: anywhere; line-height: 1.2; }
.display small { font-family: var(--font); font-size: 16px; color: #c9cbf5; margin-left: 6px; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.keys button { min-height: 62px; border-radius: 14px; background: #eef0ff; color: var(--ink); font-size: 28px; font-family: var(--show); font-weight: 400; box-shadow: 0 4px 0 #c9cbe8; }
.keys button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c9cbe8; }
.keys button.k0 { grid-column: span 1; }
.keys button.del { background: #ffe1ea; color: var(--pink-d); box-shadow: 0 4px 0 #f3b3c7; font-size: 24px; }
.keys button.zz { font-size: 22px; }
.progress { display: flex; gap: 6px; justify-content: center; margin: 12px 0 0; flex-wrap: wrap; }
.progress span { padding: 4px 10px; border-radius: 999px; background: #ffffff22; font-size: 14px; }
.progress span.done { background: var(--green); color: var(--ink); }

/* End */
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin-top: 20px; }
.pod { flex: 1; max-width: 140px; text-align: center; }
.pod .medal { font-size: 46px; animation: hop 1.2s infinite ease-in-out; }
.pod .nm { font-size: 19px; margin: 4px 0; overflow-wrap: anywhere; }
.pod .blk { border-radius: 14px 14px 0 0; display: grid; place-items: center; font-family: var(--show); font-weight: 400; font-size: 32px; color: var(--ink); border: 4px solid var(--ink); border-bottom: 0; }
.pod.p1 .blk { height: 150px; background: var(--yellow); }
.pod.p2 .blk { height: 110px; background: #dfe3ee; }
.pod.p3 .blk { height: 80px; background: #f0a868; }
.rest { margin-top: 14px; display: grid; gap: 6px; }

/* Modal / toast */
.modal-bg { position: fixed; inset: 0; background: #000a; z-index: 30; display: grid; place-items: center; padding: 16px; }
.modal { background: #fff; color: var(--ink); border-radius: 24px; padding: 20px; width: 100%; max-width: 400px; text-align: center; animation: pop .25s; }
.modal h3 { font-family: var(--show); font-weight: 400; font-size: 28px; margin: 0; }
.modal p { font-size: 17px; color: var(--muted); margin: 8px 0 0; }
.modal .row { margin-top: 16px; }
.modal .btn { font-size: 18px; min-height: 54px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); z-index: 40; background: #fff; color: var(--ink); padding: 12px 18px; border-radius: 999px; font-size: 17px; box-shadow: 0 6px 20px #0006; max-width: calc(100% - 32px); text-align: center; animation: pop .25s; }


/* Elternmodus */
.pm-head { display: flex; align-items: center; gap: 10px; }
.pm-head .ttl { flex: 1; font-family: var(--show); font-weight: 400; font-size: 24px; line-height: 1.1; }
.pm-head .ttl small { display: block; font-family: var(--font); font-size: 14px; color: #dfe1ff; font-weight: 800; }
.pm-filter { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.pm-filter::-webkit-scrollbar { display: none; }
.pm-filter button { flex: none; padding: 10px 14px; border-radius: 999px; font-size: 16px; background: #ffffff22; color: #fff; border: 3px solid transparent; }
.pm-filter button.on { background: var(--yellow); color: var(--ink); border-color: var(--ink); }
.pm-card { background: #fff; color: var(--ink); border-radius: 24px; padding: 16px; margin-top: 12px; box-shadow: 0 6px 0 #0005; animation: pop .35s cubic-bezier(.2,1.4,.4,1); position: relative; }
.pm-card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pm-card .nr { color: var(--muted); font-size: 15px; }
.pm-card .emo { font-size: 58px; text-align: center; line-height: 1.1; margin-top: 8px; }
.pm-card .q { font-size: 23px; text-align: center; line-height: 1.3; margin-top: 6px; }
.pm-card .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.pm-card .opts div { background: #eef0ff; border-radius: 14px; padding: 10px 6px; text-align: center; font-size: 17px; border: 4px solid transparent; }
.pm-card .opts div.ok { border-color: var(--green); background: #e3fbec; }
.pm-card .opts div b { display: block; font-size: 30px; }
.pm-card .opts div small { display: block; color: var(--pink-d); font-size: 15px; margin-top: 4px; }
.pm-sol { margin-top: 12px; border-radius: 18px; background: var(--ink); color: #fff; padding: 12px 14px; }
.pm-sol .lbl { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #b9bce8; }
.pm-sol .val { font-family: var(--show); font-weight: 400; font-size: 32px; color: var(--yellow); line-height: 1.15; overflow-wrap: anywhere; }
.pm-sol .val.hid { filter: blur(12px); }
.pm-sol p { margin: 8px 0 0; font-size: 17px; line-height: 1.4; color: #e6e7ff; }
.pm-sol .eye { float: right; background: #ffffff22; border-radius: 10px; padding: 6px 10px; font-size: 14px; color: #fff; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%,100% { transform: translate(0,0) rotate(0); } 20% { transform: translate(-8px,4px) rotate(-2deg); } 40% { transform: translate(8px,-4px) rotate(2deg); } 60% { transform: translate(-6px,-2px) rotate(-1deg); } 80% { transform: translate(6px,2px) rotate(1deg); } }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
@keyframes throb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes bulb { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes wiggle { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
@keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

let photos = []; // {id, url}
let dbp = null;
function db() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open("mrquiz-fotos", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("fotos", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbp;
}
async function loadPhotos() {
  try {
    const d = await db();
    const all = await new Promise((res, rej) => { const r = d.transaction("fotos").objectStore("fotos").getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    photos = all.map(p => ({ id: p.id, url: URL.createObjectURL(p.blob) }));
  } catch (e) { photos = []; }
}
async function storePhoto(blob) {
  const id = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  photos.push({ id, url: URL.createObjectURL(blob) });
  try { const d = await db(); d.transaction("fotos", "readwrite").objectStore("fotos").put({ id, blob }); } catch (e) {}
}
async function deletePhoto(id) {

function shrink(file) {
  return new Promise(res => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b || file), "image/jpeg", .86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}
let placeholder = null;
function placeholderUrl() {
  if (placeholder) return placeholder;

  g.fillStyle = "#ffffff22";
  for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(Math.random() * 800, Math.random() * 1000, 10 + Math.random() * 60, 0, 7); g.fill(); }
  g.textAlign = "center"; g.fillStyle = "#ffd400"; g.strokeStyle = "#16163a"; g.lineWidth = 18;
  g.font = "bold 420px Arial Black, Impact, sans-serif";

}

let actx;
function ac() {
  if (!S.sound) return null;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; } catch (e) { return null; }
}
function tone(f, d, type = "sine", vol = .2, when = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
function noise(d, vol = .4, when = 0, freq = 800) {
  const a = ac(); if (!a) return;
  const len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = "lowpass"; f.frequency.value = freq; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime + when);
}
const sfx = {
  tap: () => tone(700, .06, "triangle", .12),
  boom: () => { noise(.9, .9, 0, 600); tone(70, .5, "sine", .5); },
  drum: (dur = 1.6) => { for (let t = 0; t < dur; t += .06) noise(.05, .25 + t / dur * .4, t, 1800); },
  tusch: () => { [523, 659, 784, 1047].forEach(f => { tone(f, .9, "sawtooth", .07, 0); tone(f, .9, "square", .03, 0); }); },
  tick: () => tone(1000, .08, "square", .12),
  go: () => tone(1500, .25, "square", .12),
  good: () => { tone(784, .15, "sine", .2); tone(1175, .3, "sine", .2, .12); },
  win: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .35, "triangle", .18, i * .12)); },
};

// Konfetti
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let parts = [], confRun = false;
function confetti(n = 160) {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  for (let i = 0; i < n; i++) parts.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 4, vy: 3 + Math.random() * 5,
    r: 4 + Math.random() * 6, c: COLORS[i % COLORS.length], a: Math.random() * 6, va: (Math.random() - .5) * .3 });
  if (!confRun) { confRun = true; requestAnimationFrame(confStep); }
}
function confStep() {
  cx.clearRect(0, 0, cv.width, cv.height);
  const d = devicePixelRatio;
  parts.forEach(p => { p.x += p.vx * d; p.y += p.vy * d; p.a += p.va; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r * d, -p.r * d / 2, p.r * 2 * d, p.r * d); cx.restore(); });
  parts = parts.filter(p => p.y < cv.height + 30);
  if (parts.length) requestAnimationFrame(confStep); else { confRun = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

const COLS = 6, ROWS = 7;
function tilesHTML(url) {
  let h = "";
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    h += `<div class="tile" style="left:${c * 100 / COLS}%;top:${r * 100 / ROWS}%;width:${100 / COLS + .3}%;height:${100 / ROWS + .3}%;` +

  }
  return h;
}
function scatter(el, strong) {
  const c = +el.dataset.c, r = +el.dataset.r;
  const dx = (c - (COLS - 1) / 2) / COLS, dy = (r - (ROWS - 1) / 2) / ROWS;
  const k = strong ? 900 : 500;
  const x = dx * k + (Math.random() - .5) * k * .6, y = dy * k + (Math.random() - .5) * k * .6 - (strong ? 120 : 0);
  return `translate(${x.toFixed(0)}px, ${y.toFixed(0)}px) rotate(${((Math.random() - .5) * 720).toFixed(0)}deg) scale(${(.3 + Math.random() * .9).toFixed(2)})`;
}
function bulbs() {
  let h = ""; const n = 22;
  for (let i = 0; i < n; i++) {
    const t = i / n; let x, y;
    if (t < .25) { x = t * 4 * 100; y = 0; } else if (t < .5) { x = 100; y = (t - .25) * 4 * 100; } else if (t < .75) { x = 100 - (t - .5) * 4 * 100; y = 100; } else { x = 0; y = 100 - (t - .75) * 4 * 100; }
    h += `<i style="left:calc(${x}% - 5px);top:calc(${y}% - 5px);animation-delay:${(i % 2) * .5}s"></i>`;
  }
  return `<div class="bulbs">${h}</div>`;
}

    <div class="progress">${G.players.map((x, i) => `<span class="${i < G.turn ? "done" : ""}">${i < G.turn ? "✓ " : ""}${esc(x.name)}</span>`).join("")}</div>
  </div>`);
}
function entry() {
  const p = G.players[G.turn], q = G.q;
  G.input = "";
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "000", "0", "⌫"];
  render(`<div class="entry">
    <div class="who-now"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${p.color};border:2px solid var(--ink);vertical-align:middle"></span> ${esc(p.name)} schätzt …</div>
    <div class="qsmall">${q.e} ${esc(q.q)}</div>
    <div class="display" id="disp"></div>
    <div class="keys">${keys.map(k => `<button class="${k === "⌫" ? "del" : k === "000" ? "zz" : ""}" data-go="key|${k}">${k}</button>`).join("")}</div>
    <div class="mt"><button class="btn pink" id="lock" data-go="lockGuess" disabled>🔒 Tipp abgeben</button></div>
  </div>`, updDisp);
}
function updDisp() {
  const v = G.input;
  $("#disp").innerHTML = (v ? fmt(+v) : `<span style="opacity:.35">0</span>`) + `<small>${esc(G.q.unit)}</small>`;
  $("#lock").disabled = !v;
}
async function reveal() {
  const q = G.q;
  render(`<div class="stagehead">${logo(true)}</div>${scoreBar()}${qHeader(q)}
    <div class="qcard"><div class="emo" style="font-size:48px">${q.e}</div><div class="q" style="font-size:20px">${esc(q.q)}</div></div>
    <div class="answer" id="ans"><div class="lbl">Die richtige Antwort ist …</div><div class="num" id="num">🥁</div></div>
    <div id="rest"></div>`);
  sfx.drum(1.6); buzz([30, 40, 30, 40, 30, 40, 30]);
  await sleep(1650);
  // Zahl hochzählen
  const el = $("#num"), target = q.a, t0 = performance.now(), dur = 900;
  await new Promise(res => {
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.innerHTML = fmt(Math.round(target * e)) + ` <span class="u">${esc(q.unit)}</span>`;
      if (k < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
  sfx.tusch(); confetti(120);
  if (!G.guesses.length) {
    $("#rest").innerHTML = `<div class="fact"><b>🤯 Wow-Fakt:</b><br>${esc(q.f)}</div>
      <div class="mt"><button class="btn pink" data-go="stage">💥 Nächste Frage</button></div>`;
    return;
  }
  const ranked = G.guesses.map((g, i) => ({ i, g, d: Math.abs(g - target) })).sort((a, b) => a.d - b.d);
  const best = ranked[0].d;
  const medals = ["🥇", "🥈", "🥉"];
  let place = 0, prev = -1;
  ranked.forEach((r, k) => { if (r.d !== prev) { place = k; prev = r.d; } r.place = place; });
  ranked.forEach(r => { if (r.d === best) { r.pts = r.d === 0 ? 2 : 1; G.players[r.i].score += r.pts; } });
  const sb = document.querySelector(".score"); if (sb) sb.outerHTML = scoreBar();
  $("#rest").innerHTML = `
    <div class="ranking">${ranked.map((r, k) => { const p = G.players[r.i];
      return `<div class="rk ${r.pts ? "win" : ""}" style="animation-delay:${k * .12}s"><span class="pos">${medals[r.place] || (r.place + 1) + "."}</span>
        <span class="nm">${esc(p.name)}${r.pts ? `<span class="pts">+${r.pts}</span>` : ""}</span>
        <span class="g">${fmt(r.g)}<span class="d">${r.d === 0 ? "VOLLTREFFER! 🎯" : (r.g > target ? "+" : "−") + fmt(r.d) + " daneben"}</span></span></div>`; }).join("")}</div>
    ${best === 0 ? `<p style="text-align:center;font-size:18px;margin:10px 0 0">🎯 Volltreffer gibt 2 Punkte!</p>` : ""}
    <div class="fact"><b>🤯 Wow-Fakt:</b><br>${esc(q.f)}</div>
    <div class="mt"><button class="btn pink" data-go="stage">💥 Nächste Frage</button></div>`;
}

/* ---------- Elternmodus (Quizmaster) ---------- */
let PM = null; // { filter, deck, n, q, hide }
function pmDeck() {
  return shuffle(QUESTIONS.filter(q => PM.filter === "mix" || q.t === PM.filter));
}
function solutionText(q) {
  if (q.type === "s") return `${fmt(q.a)} ${q.unit}`;
  if (q.type === "m") return q.ok === 0 ? q.A[1] : q.B[1];
  return q.ok ? "👍 Wahr" : "👎 Quatsch";
}
function parentView(anim) {
  const q = PM.q;
  const filters = [["mix", "🎲 Bunter Mix"], ...Object.entries(TOPICS)];
  const opts = q.type === "m"
    ? `<div class="opts">${[q.A, q.B].map((o, i) => `<div class="${i === q.ok && !PM.hide ? "ok" : ""}"><b>${o[0]}</b>${esc(o[1])}${PM.hide ? "" : `<small>${esc(o[2])}</small>`}</div>`).join("")}</div>`
    : q.type === "w" ? `<div class="opts"><div class="${q.ok ? "ok" : ""}"><b>👍</b>Wahr</div><div class="${q.ok ? "" : "ok"}"><b>👎</b>Quatsch</div></div>` : "";
  render(`
    <div class="pm-head"><button class="iconbtn" data-go="setup" aria-label="Zurück">⬅️</button>
      <div class="ttl">🎙️ Elternmodus<small>Frage vorlesen – Lösung steht unten</small></div>
      ${canSpeak ? `<button class="iconbtn" data-go="pmRead" aria-label="Vorlesen">🔊</button>` : ""}</div>
    <div class="pm-filter">${filters.map(([k, n]) => `<button class="${PM.filter === k ? "on" : ""}" data-go="pmFilter|${k}">${n}</button>`).join("")}</div>
    <div class="pm-card" ${anim ? "" : 'style="animation:none"'}>
      <div class="top"><span class="qtype ${q.type}" style="font-size:16px;padding:4px 12px">${TYPES[q.type]}</span><span class="nr">Frage ${PM.n}</span></div>
      ${q.type !== "m" ? `<div class="emo">${q.e}</div>` : ""}
      <div class="q">${esc(q.q)}</div>
      ${q.type === "s" ? `<div class="unit" style="text-align:center;color:var(--muted);margin-top:6px">Antwort in: <b>${esc(q.unit)}</b></div>` : ""}
      ${PM.hide && q.type === "w" ? "" : opts}
      <div class="pm-sol"><button class="eye" data-go="pmHide">${PM.hide ? "👀 Zeigen" : "🙈 Verdecken"}</button>
        <div class="lbl">Lösung</div><div class="val ${PM.hide ? "hid" : ""}">${esc(solutionText(q))}</div>
        ${PM.hide ? "" : `<p>🤯 ${esc(q.f)}</p>`}</div>
    </div>
    <div class="mt"><button class="btn pink" data-go="pmNext" style="min-height:72px;font-size:24px">🎲 Nächste Frage</button></div>`);
}
function pmNext() {
  if (!PM.deck.length) PM.deck = pmDeck();
  PM.q = PM.deck.pop(); PM.n++;
  sfx.boom(); buzz(60);
  parentView(true);
}

/* ---------- Was ist mehr? / Wahr oder Quatsch ---------- */
async function countdown() {
  const act = $("#act");
  for (const n of ["3", "2", "1"]) { act.innerHTML = `<div class="countdown">${n}</div>`; sfx.tick(); buzz(40); await sleep(750); }
  act.innerHTML = `<div class="countdown go">${G.q.type === "w" ? "DAUMEN!" : "ZEIGEN!"}</div>`; sfx.go(); buzz(150);
  await sleep(900);
  act.innerHTML = `<button class="btn green" data-go="resolve">🥁 Auflösen</button>`;
}
async function resolve() {
  const q = G.q, act = $("#act");
  act.innerHTML = `<div class="countdown go" style="font-size:44px">🥁 …</div>`;
  sfx.drum(1.1); await sleep(1150);
  const win = q.type === "m" ? q.ok : (q.ok ? 0 : 1);
  [0, 1].forEach(i => $("#o" + i).classList.add(i === win ? "win" : "lose"));
  if (q.type === "m") { $("#o0 .v").textContent = q.A[2]; $("#o1 .v").textContent = q.B[2]; }
  sfx.tusch(); confetti(80);
  const verdict = q.type === "w" ? (q.ok ? "✅ Das ist WAHR!" : "❌ Das ist QUATSCH!") : `✅ ${q.ok === 0 ? q.A[1] : q.B[1]}!`;
  if (!G.players.length) {
    act.innerHTML = `<div class="fact"><b>${esc(verdict)}</b><br>${esc(q.f)}</div>
      <div class="mt"><button class="btn pink" data-go="stage">💥 Nächste Frage</button></div>`;
    return;
  }
  act.innerHTML = `
    <div class="fact"><b>${esc(verdict)}</b><br>${esc(q.f)}</div>
    <div class="sectitle">Wer lag richtig?</div>
    <div class="who">${G.players.map((p, i) => `<button data-go="toggleRight|${i}" id="w${i}"><i style="background:${p.color}"></i><span>${esc(p.name)}</span></button>`).join("")}</div>
    <div class="mt"><button class="btn pink" data-go="award">✅ Punkte geben & weiter</button></div>`;
}

function end() {
  const ranked = G.players.slice().sort((a, b) => b.score - a.score);
  let place = 0, prev = null;
  ranked.forEach((p, k) => { if (p.score !== prev) { place = k + 1; prev = p.score; } p.place = place; });
  const top = ranked.slice(0, 3), order = top.length === 3 ? [top[1], top[0], top[2]] : top.length === 2 ? [top[1], top[0]] : top;
  const medal = { 1: "🥇", 2: "🥈", 3: "🥉" };
  const winners = ranked.filter(p => p.place === 1).map(p => p.name);
  render(`${logo(true)}
    <div class="answer"><div class="lbl">Und der Sieg geht an …</div><div class="num" style="font-size:clamp(36px,11vw,56px)">${esc(winners.join(" & "))}</div></div>
    <div class="podium">${order.map(p => `<div class="pod p${Math.min(p.place, 3)}"><div class="medal">${medal[Math.min(p.place, 3)]}</div><div class="nm">${esc(p.name)}</div><div class="blk">${p.score}</div></div>`).join("")}</div>
    ${ranked.length > 3 ? `<div class="rest">${ranked.slice(3).map(p => `<div class="rk"><span class="pos">${p.place}.</span><span class="nm">${esc(p.name)}</span><span class="g">${p.score}</span></div>`).join("")}</div>` : ""}
    <div class="mt"><button class="btn pink" data-go="again">🔁 Neues Spiel</button></div>
    <div class="mt"><button class="btn ghost" data-go="setup">⚙️ Zum Start</button></div>`);
  sfx.win(); confetti(260); setTimeout(() => confetti(160), 900);
  if (S.sound) speak(`Und der Sieg geht an ${winners.join(" und ")}!`);
}

/* ================================================================
   AKTIONEN
   ================================================================ */
const A = {
  parent() { PM = { filter: "mix", deck: [], n: 0, q: null, hide: false }; PM.deck = pmDeck(); pmNext(); },
  pmNext,
  pmFilter(k) { PM.filter = k; PM.deck = pmDeck(); pmNext(); },
  pmHide() { PM.hide = !PM.hide; parentView(false); },
  pmRead() { speak(readText(PM.q)); },
  setup, stage, handoff, entry, countdown, resolve, reveal,
  points(v) { S.points = v === "1"; save(); setup(); },
  mode(m) { S.mode = m; save(); setup(); },
  addName() {
    const inp = $("#newname"); const n = (inp && inp.value || "").trim();
    if (!n) { toast("Bitte einen Namen eintippen ✏️"); inp && inp.focus(); return; }
    (S.mode === "spieler" ? S.spieler : S.teams).push(n); save(); setup();
    const ni = $("#newname"); if (ni) ni.focus();
  },
  delName(i) { (S.mode === "spieler" ? S.spieler : S.teams).splice(+i, 1); save(); setup(); },
  async delPhoto(id) { await deletePhoto(id); setup(); },
  toggle(key, k) {
    const arr = S[key];
    if (arr.includes(k)) { if (arr.length === 1) return toast("Mindestens eins muss an bleiben"); S[key] = arr.filter(x => x !== k); }
    else arr.push(k);
    save(); setup();
  },
  sound() { S.sound = !S.sound; save(); setup(); },
  start() {
    const list = S.points ? (S.mode === "spieler" ? S.spieler : S.teams) : [];
    if (S.points && list.length < 2) return toast(S.mode === "spieler" ? "Mindestens 2 Spieler eintragen 🙂" : "Mindestens 2 Teams eintragen 🙂");
    const deck = buildDeck();
    if (!deck.length) return toast("Für diese Auswahl gibt es keine Fragen");
    G = { players: list.map((n, i) => ({ name: n, color: COLORS[i % COLORS.length], score: 0 })), deck, photo: null };
    sfx.tusch(); stage();
  },
  again() { G.players.forEach(p => p.score = 0); G.deck = buildDeck(); stage(); },
  async press() { await explode(); nextQuestion(); },
  read() { speak(readText(G.q)); },
  key(k) {
    if (k === "⌫") G.input = G.input.slice(0, -1);
    else if (G.input.length < 12) { G.input = (G.input + k).replace(/^0+/, ""); }
    updDisp();
  },
  lockGuess() {
    G.guesses[G.turn] = +G.input; G.turn++;
    sfx.good(); buzz(30);
    if (G.turn < G.players.length) handoff(); else reveal();
  },
  toggleRight(i) {
    i = +i; G.right.has(i) ? G.right.delete(i) : G.right.add(i);
    $("#w" + i).classList.toggle("on", G.right.has(i));
  },
  award() {
    G.right.forEach(i => G.players[i].score++);
    if (G.right.size) { sfx.good(); confetti(60); }
    stage();
  },
  end() {
    if (!G.players.length) return confirmBox("Show beenden?", "", "Beenden", "Weiterspielen", () => { stopSpeak(); setup(); });
    confirmBox("Show beenden?", "Dann kommt die Siegerehrung.", "Siegerehrung 🏆", "Weiterspielen", end);
  },
};

loadPhotos().then(setup);
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
